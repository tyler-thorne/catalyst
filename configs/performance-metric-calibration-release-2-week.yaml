slug: performance-metric-calibration-release-2-week

segments:
  - Windows
  - Linux
  - Mac

histograms:
  # Memory
  - metrics.memory_distribution.memory_total

  # CPU time per process type
  - metrics.labeled_counter.power_cpu_time_per_process_type_ms:
      aggregate: percentiles

  # Page load
  - metrics.timing_distribution.performance_pageload_fcp
  - metrics.timing_distribution.perf_largest_contentful_paint
  - metrics.timing_distribution.performance_pageload_load_time
  - metrics.timing_distribution.performance_time_response_start
  - metrics.timing_distribution.layout_time_to_first_interaction

  # Networking (primary outcome: networking_performance)
  - metrics.timing_distribution.networking_dns_lookup_time
  - metrics.timing_distribution.networking_transaction_wait_time
  - metrics.timing_distribution.networking_http_channel_page_open_to_first_sent
  - metrics.timing_distribution.networking_http_channel_sub_open_to_first_sent

  # Scroll latency
  - metrics.timing_distribution.gfx_scroll_present_latency

  # Frame rate
  - metrics.quantity.gfx_target_frame_rate:
      aggregate: percentiles

events:
  - crash

  - pageload:
      fcp_time:
        max: 30000
      lcp_time:
        max: 30000
      load_time:
        max: 30000
      response_time:
        max: 30000
      js_exec_time:
        max: 30000
